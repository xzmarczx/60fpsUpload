<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glassy Video Speed Tool</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Animated background */
body::before,
body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(80px);
    animation:float 8s infinite ease-in-out;
}

body::before{
    background:#00ffcc;
    top:-100px;
    left:-100px;
}

body::after{
    background:#ff00aa;
    bottom:-100px;
    right:-100px;
    animation-delay:4s;
}

@keyframes float{
    0%{
        transform:translateY(0px) translateX(0px);
    }
    50%{
        transform:translateY(30px) translateX(20px);
    }
    100%{
        transform:translateY(0px) translateX(0px);
    }
}

.container{
    width:340px;
    padding:30px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 0 10px rgba(255,255,255,0.05);
    text-align:center;
    position:relative;
    z-index:10;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(0.95);
    }
    to{
        opacity:1;
        transform:translateY(0px) scale(1);
    }
}

.logo{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
    background:linear-gradient(90deg,#00ffcc,#00aaff,#ff00aa);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:25px;
}

.upload-box{
    border:2px dashed rgba(255,255,255,0.25);
    padding:25px 10px;
    border-radius:20px;
    margin-bottom:20px;
    transition:0.3s;
    cursor:pointer;
}

.upload-box:hover{
    border-color:#00ffcc;
    transform:scale(1.02);
}

.upload-box p{
    color:#e2e8f0;
    font-size:14px;
}

input{
    display:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#00ffcc,#00aaff);
    color:#000;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,255,200,0.35);
}

button:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 0 30px rgba(0,255,200,0.6);
}

button:active{
    transform:scale(0.98);
}

#status{
    margin-top:18px;
    font-size:14px;
    color:#e2e8f0;
    min-height:20px;
}

.progress{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    overflow:hidden;
    margin-top:15px;
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,#00ffcc,#00aaff,#ff00aa);
    transition:0.3s;
}

.file-name{
    margin-top:10px;
    font-size:13px;
    color:#94a3b8;
}

</style>
</head>
<body>

<div class="container">

    <div class="logo">Video Speed Tool</div>
    <div class="sub">Glassy FFmpeg Style UI</div>

    <label class="upload-box">
        <input type="file" id="videoInput" accept="video/*">
        <p>Tap to Upload Video</p>
        <div class="file-name" id="fileName">No file selected</div>
    </label>

    <button onclick="processVideo()">
        Process & Download
    </button>

    <div class="progress">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div id="status">Waiting...</div>

</div>

<script>

const input = document.getElementById("videoInput");
const fileName = document.getElementById("fileName");
const statusText = document.getElementById("status");
const bar = document.getElementById("bar");

input.addEventListener("change", ()=>{

    if(input.files[0]){
        fileName.innerText = input.files[0].name;
    }

});

function setProgress(value){
    bar.style.width = value + "%";
}

async function processVideo(){

    const file = input.files[0];

    if(!file){
        alert("Upload a video first");
        return;
    }

    try{

        statusText.innerText = "Preparing video...";
        setProgress(15);

        statusText.innerText = "Loading FFmpeg core...";
        setProgress(10);

        // REAL FFmpeg WASM for GitHub Pages / Chrome
        // This works properly online.

        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js";

        await new Promise((resolve,reject)=>{
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });

        const { FFmpeg } = FFmpegWASM;

        const ffmpeg = new FFmpeg();

        await ffmpeg.load({
            coreURL:"https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js"
        });

        setProgress(30);
        statusText.innerText = "Writing video...";

        const data = await file.arrayBuffer();

        await ffmpeg.writeFile(
            "input.mp4",
            new Uint8Array(data)
        );

        setProgress(55);
        statusText.innerText = "Applying -itsscale 2...";

        await ffmpeg.exec([
            "-itsscale",
            "2",
            "-i",
            "input.mp4",
            "-c",
            "copy",
            "output.mp4"
        ]);

        setProgress(85);
        statusText.innerText = "Preparing download...";

        const output = await ffmpeg.readFile("output.mp4");

        const blob = new Blob(
            [output.buffer],
            { type:"video/mp4" }
        );

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "output.mp4";
        a.click();

        URL.revokeObjectURL(url);

        setProgress(100);
        statusText.innerText = "Download complete ✅";

    }catch(err){

        console.error(err);
        statusText.innerText = "Error: " + err.message;

    }

}

function wait(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

</script>

</body>
</html>
